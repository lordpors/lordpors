<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LordPors</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#07070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Halaman ini SENGAJA hampir kosong.

     Ia cuma penunjuk arah sampai dashboard lordpors benar-benar
     dirancang. Mengisinya dengan angka-angka hiasan sekarang akan
     membuat kantor di baliknya terlihat seperti mainan, dan bagian
     yang sungguhan jadi ikut diragukan. */
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:26px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    background:
      radial-gradient(ellipse 60% 45% at 50% -5%, rgba(77,184,255,.10), rgba(0,0,0,0) 100%),
      radial-gradient(ellipse 40% 30% at 8% 10%, rgba(255,217,61,.05), rgba(0,0,0,0) 100%),
      #07070f;
    color:#e9eef6; font-family:'Poppins',system-ui,sans-serif;
  }
  h1{
    margin:0; font-family:'Orbitron',monospace; font-size:clamp(26px,7vw,44px);
    font-weight:900; letter-spacing:.16em; color:#ffd93d;
    text-shadow:0 0 22px rgba(255,217,61,.45), 0 0 46px rgba(255,217,61,.2);
  }
  .sub{margin:-16px 0 0; font-size:11px; letter-spacing:.24em; color:#8d9ab0}
  .pintu{display:grid; gap:13px; width:min(430px,100%)}
  a.kartu, div.kartu{
    display:flex; align-items:center; gap:13px; padding:16px 18px;
    border-radius:14px; text-decoration:none; color:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.022));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    transition:border-color .18s, background .18s, transform .18s;
  }
  a.kartu:hover{border-color:rgba(103,232,249,.45); transform:translateY(-2px)}
  .kartu .ikon{font-size:22px; line-height:1}
  .kartu b{display:block; font-size:14px; font-weight:600}
  .kartu span{display:block; font-size:11px; color:#8d9ab0; margin-top:2px; line-height:1.5}
  .kartu .tanda{
    margin-left:auto; flex:0 0 auto; font-size:9px; font-weight:700; letter-spacing:.08em;
    padding:3px 9px; border-radius:99px; text-transform:uppercase;
  }
  .siap{background:rgba(52,211,153,.12); color:#34d399}
  .belum{background:rgba(255,255,255,.06); color:#8d9ab0}
  /* Pintu yang belum ada TIDAK dibuat seperti tautan. Tautan yang
     diklik lalu tidak ke mana-mana lebih menjengkelkan daripada
     pintu yang jujur mengaku belum dibangun. */
  div.kartu{opacity:.62; cursor:not-allowed}
  footer{font-size:10.5px; color:#5f6b80; text-align:center; line-height:1.6}
</style>
</head>
<body>

<h1>LORDPORS</h1>
<p class="sub">COMMPANY</p>

<nav class="pintu">
  <a class="kartu" href="/kantor/">
    <span class="ikon">🏢</span>
    <span>
      <b>Kantor</b>
      <span>Panggung agen, status auditor, log pekerjaan.</span>
    </span>
    <span class="tanda siap">siap</span>
  </a>

  <div class="kartu">
    <span class="ikon">🏠</span>
    <span>
      <b>Rumah</b>
      <span>Belum dibangun.</span>
    </span>
    <span class="tanda belum">nanti</span>
  </div>
</nav>

<footer>
  Halaman pribadi, tidak diindeks.<br>
  Kehadiran agen &amp; tugas hanya hidup saat kantor dibuka dari komputer.
</footer>

</body>
</html>
